{{- $current := . }}
<header class="site-header">
  <div class="wrap">
    <nav class="pill" aria-label="Main">
      <a class="wordmark" href="/"{{ if .IsHome }} aria-current="page"{{ end }}>burks<span>.</span>tech</a>
      <ul class="nav">
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        <li><button class="theme-toggle" type="button" aria-label="Switch theme">{{ partial "icon.html" "moon" }}{{ partial "icon.html" "sun" }}</button></li>
      </ul>
    </nav>
  </div>
</header>
